[Preloader.Entrypoint]

## Particle Fleet runs Unity 5.3. BepInEx's default entrypoint (UnityEngine.Application) starts plugins while
## Unity is still loading scripts, which crashes the game or leaves a black screen. MonoBehaviour starts later.
# Setting type: String
# Default value: UnityEngine.dll
Assembly = UnityEngine.dll

# Setting type: String
# Default value: Application
Type = MonoBehaviour

# Setting type: String
# Default value: .cctor
Method = .cctor
